version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
