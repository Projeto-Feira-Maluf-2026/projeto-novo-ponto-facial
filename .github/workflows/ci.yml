name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:test@db.example.supabase.co:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      PASSWORD_PEPPER: ci-only-password-pepper-value-1234567890
      FIELD_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.11"
      - name: Install API from lockfile
        run: |
          cd api
          uv sync --locked --extra dev
      - name: Verify serverless requirements match the lock
        run: |
          uv export --project api --locked --no-dev --no-hashes --no-emit-project --output-file requirements.txt --quiet
          git diff --exit-code -- requirements.txt
      - name: Test API
        run: |
          cd api
          uv run --locked --extra dev ruff check app ../tests
          uv run --locked --extra dev pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test and build web
        run: |
          npm ci
          npm test --workspace=web -- --run
          npm run build --workspace=web

  postgres-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ponto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
      - name: Install isolated PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Rehearse locks, rollback and restored equality
        env:
          ISOLATED_POSTGRES_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
        run: uv run --project api --locked --extra dev python scripts/verify_postgres_restore.py
      - name: Test application concurrency against real PostgreSQL
        env:
          PONTO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:synthetic-ci-only@127.0.0.1:5432/ponto_test
          DATABASE_URL: postgresql://postgres:synthetic-ci-only@db.example.supabase.co:5432/postgres
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
          PASSWORD_PEPPER: ci-only-password-pepper-value-1234567890
          FIELD_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: uv run --project api --locked --extra dev pytest tests/test_postgres_attendance_concurrency.py -q
