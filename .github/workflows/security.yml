name: security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history without exposing values
        run: |
          status=0
          "${{ runner.temp }}/gitleaks" git --redact --no-banner --log-level warn \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" . || status=$?
          # Location and rule only; secret values never reach the log (--redact).
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::commit \(.Commit[0:7]) \(.Date[0:10])"' \
            "$RUNNER_TEMP/gitleaks.json" 2>/dev/null || true
          exit "$status"
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.11'
      - name: Audit complete npm lock
        run: |
          npm ci --ignore-scripts
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          # Each advisory becomes an annotation, readable on the PR without the raw log.
          node -e '
            const report = require(process.argv[1]);
            const blocking = new Set(["moderate", "high", "critical"]);
            let failed = false;
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              const advisories = item.via.filter((via) => typeof via === "object")
                .map((via) => `${via.title} (${via.url})`).join("; ") || `via ${item.via.join(", ")}`;
              const fix = item.fixAvailable === true ? "fix available" : item.fixAvailable ? `fix: ${item.fixAvailable.name}@${item.fixAvailable.version}` : "no fix";
              console.log(`::${blocking.has(item.severity) ? "error" : "warning"} title=npm audit ${item.severity}::${name} ${item.range} - ${advisories} - ${fix}`);
              if (blocking.has(item.severity)) failed = true;
            }
            process.exit(failed ? 1 : 0);
          ' "$RUNNER_TEMP/npm-audit.json"
      - name: Audit locked API including AI runtime
        run: |
          uv export --project api --locked --extra dev --extra ai --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/api-audit.txt"
          uvx --python 3.12 pip-audit==2.10.1 --requirement "$RUNNER_TEMP/api-audit.txt" --disable-pip --no-deps
