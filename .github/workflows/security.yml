name: security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history without exposing values
        run: '"${{ runner.temp }}/gitleaks" git --redact --no-banner --log-level warn .'
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
      - name: Audit complete npm lock
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: Audit locked API including AI runtime
        run: |
          uv export --project api --locked --extra dev --extra ai --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/api-audit.txt"
          uvx --python 3.12 pip-audit==2.10.1 --requirement "$RUNNER_TEMP/api-audit.txt" --disable-pip --no-deps
