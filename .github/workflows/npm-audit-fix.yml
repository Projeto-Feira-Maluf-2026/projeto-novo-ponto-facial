name: npm-audit-fix (temporário)
on:
  push:
    branches: [chore/npm-audit-fix]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Atualiza somente o lock dentro das faixas do package.json
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --workspace=web vitest@^4.1.12
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=moderate || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json web/package.json
          git diff --cached --quiet && echo "::notice::lock sem mudanças" && exit 0
          git commit -m "Atualiza dependências com correções de segurança (vitest 4.1.12+)"
          git push
