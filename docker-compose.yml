services:
  postgres:
    image: postgres:16-alpine
    container_name: ponto-postgres
    environment:
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
      POSTGRES_DB: ponto_facial
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponto -d ponto_facial"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ponto-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: ponto-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://ponto:ponto@postgres:5432/ponto_facial
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      AUTO_CREATE_TABLES: "false"
      JWT_SECRET_KEY: troque-em-producao
      PASSWORD_PEPPER: troque-em-producao
      CORS_ORIGINS: http://localhost:5174,http://localhost:8080
      FACE_PROVIDER: insightface
      FACE_MODEL_ROOT: /models
      FACE_EXECUTION_PROVIDERS: CPUExecutionProvider
      FACE_THRESHOLDS_CALIBRATED: "false"
    ports:
      - "8000:8000"
    volumes:
      - api-uploads:/app/uploads
      - ${FACE_MODEL_HOST_PATH:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    build:
      context: ./web
    container_name: ponto-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres-data:
  redis-data:
  api-uploads:
