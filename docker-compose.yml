services:
  redis:
    image: redis:7-alpine
    container_name: ponto-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: ponto-api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL do Supabase no .env}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL no .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY no .env}
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?Configure PASSWORD_PEPPER no .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Configure FIELD_ENCRYPTION_KEY no .env}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Curitiba Empreiteira}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      CORS_ORIGINS: http://localhost:5174,http://localhost:8080
      FACE_PROVIDER: insightface
      FACE_MODEL_ROOT: /models
      FACE_EXECUTION_PROVIDERS: CPUExecutionProvider
      FACE_THRESHOLDS_CALIBRATED: "false"
    ports:
      - "8000:8000"
    volumes:
      - api-uploads:/app/uploads
      - ${FACE_MODEL_HOST_PATH:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    build:
      context: ./web
    container_name: ponto-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  redis-data:
  api-uploads:
