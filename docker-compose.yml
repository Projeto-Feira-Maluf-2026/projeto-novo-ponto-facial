services:
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: ponto-redis
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [cache]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: ponto-api
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs: ["/tmp:size=256m,mode=1777"]
    networks: [cache, application]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL do Supabase no .env}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL no .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY no .env}
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?Configure PASSWORD_PEPPER no .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Configure FIELD_ENCRYPTION_KEY no .env}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Curitiba Empreiteira}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      CORS_ORIGINS: http://localhost:5174,http://localhost:8080
      FACE_PROVIDER: insightface
      FACE_MODEL_ROOT: /models
      FACE_EXECUTION_PROVIDERS: CPUExecutionProvider
      FACE_THRESHOLDS_CALIBRATED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api-uploads:/app/uploads
      - ${FACE_MODEL_HOST_PATH:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Configure VITE_SUPABASE_URL no .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Configure a chave publica VITE_SUPABASE_PUBLISHABLE_KEY no .env}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_FACE_API_URL: ${VITE_FACE_API_URL:-/api/v1}
    container_name: ponto-web
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [application]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  cache:
    internal: true
  application:

volumes:
  redis-data:
  api-uploads:
